id = "fluxxy_pvp"
kind = "mod"
name = "Fluxxy's PvP Pack"
summary = "PvP helpers in one mod: low fire, food info, armour HUD, item counters, damage indicator and elytra pitch."
description = """
Client-side helpers for PvP, each with its own switch in Options > Mods > Fluxxy's PvP Pack.

- **Low fire**: while you burn, the fire overlay is drawn lower on the screen, so it hides less of the view (Low,
  Lower or Lowest).
- **Food info**: AppleSkin's saturation outlines over the hunger bar and its exhaustion bar under it.
- **Elytra pitch**: while gliding, the angle you look at under the crosshair.
- **Armor HUD**: the armour you wear and its durability in slots left of the hotbar (only drawn, never clickable).
- **Item counters**: golden apples, ender pearls, totems, arrows, potions and cobwebs you carry, bottom right.
- **Damage indicator**: how many hearts a hit took, above your hearts, for a moment.

It only draws on your screen: nothing changes how the game plays. Food info is ported from
[AppleSkin](https://github.com/squeek502/AppleSkin) by squeek502 (public domain, the Unlicense): its pixels and its
layout. The other helpers are this mod's own code, on ideas from PVP Essentials, "low fire" packs and elytra HUD mods. English and French.

A WebAssembly mod: install it from the launcher's Mods page, with nothing to build.
"""
